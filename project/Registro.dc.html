<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F4F5F6; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6B7A90; text-decoration: none; }
    a:hover { color: #55657C; }
    * { box-sizing: border-box; }
    input::placeholder { color: #8B8F95; }
  </style>
</helmet>

<div style="background:#F4F5F6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px">
  <div style="width:100%;max-width:440px;background:#FFFFFF;border:1px solid #E8EAEC;border-radius:32px;padding:48px">
    <h1 style="font-size:28px;font-weight:800;color:#101010;margin:0 0 8px;letter-spacing:-0.01em">Únete gratis</h1>
    <p style="font-size:15px;color:#515151;margin:0 0 32px;line-height:1.5">Crea tu cuenta en menos de un minuto.</p>

    <form style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="display:block;font-size:13px;font-weight:600;color:#101010;margin-bottom:8px">Nombre completo</label>
        <input type="text" placeholder="Tu nombre" style="width:100%;border:1px solid #E8EAEC;border-radius:18px;padding:14px 18px;font-size:15px;font-family:inherit;background:#F4F5F6;color:#101010" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:600;color:#101010;margin-bottom:8px">Correo electrónico</label>
        <input type="email" placeholder="tucorreo@ejemplo.com" style="width:100%;border:1px solid #E8EAEC;border-radius:18px;padding:14px 18px;font-size:15px;font-family:inherit;background:#F4F5F6;color:#101010" />
      </div>

      <button type="submit" style="background:#6B7A90;color:#FFFFFF;font-size:16px;font-weight:700;padding:16px 32px;border-radius:999px;border:none;font-family:inherit;cursor:pointer;margin-top:8px" style-hover="background:#55657C">Únete gratis</button>
    </form>

    <p style="font-size:13px;color:#8B8F95;text-align:center;margin:20px 0 0;line-height:1.5">Sin tarjeta, sin compromiso — recibe 80 créditos al instante.</p>

    <p style="font-size:14px;color:#515151;text-align:center;margin:24px 0 0">¿Ya tienes cuenta? <a href="#" style="font-weight:600">Iniciar sesión</a></p>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {}</script>
</body>
</html>
